<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Discord — GBZin Tickets</title><link rel="stylesheet" href="/style.css"><script src="/config.js"></script></head>
<body><header><a class="brand" href="/tickets/">◈ GBZin <span>Tickets</span></a></header><main><section class="hero"><p class="eyebrow">GBZIN TICKETS · LOGIN</p><h1>Entrar com <span>Discord</span></h1><p class="sub">O login será aberto no servidor de autenticação.</p><p id="status" class="note" role="status">Verificando configuração…</p><button id="login" class="primary" disabled>Continuar com Discord ↗</button><p><a href="/tickets/" style="color:#9ba8c3">Voltar ao painel</a></p></section></main>
<script>
const statusEl=document.getElementById('status');const button=document.getElementById('login');const cfg=window.GBZIN_CONFIG||{};const backend=(cfg.BACKEND_URL||'').replace(/\/$/,'');
if(!window.GBZIN_CONFIGURED){statusEl.textContent='Falta configurar a URL do servidor Node.js. Abra config.js no GitHub e substitua COLE_A_URL_DO_BACKEND_AQUI pela URL pública da BlazeHosting. Esta página não vai ficar carregando em loop.';}
else {button.disabled=false;statusEl.textContent='Pronto para entrar.';button.addEventListener('click',()=>{statusEl.textContent='Abrindo o Discord…';window.location.assign(backend+'/auth/discord');});}
</script></body></html>
