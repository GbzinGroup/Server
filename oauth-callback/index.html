<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#080d18">
  <title>Verificação Discord — Toshiro</title>
  <style>
    :root{color-scheme:dark;--bg:#080d18;--card:#101827;--line:#25334a;--text:#f3f6fc;--muted:#9eacc2;--blue:#5865f2;--cyan:#70d9ff;--green:#57f287;--red:#ed4245}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% -10%,#24376b 0,transparent 50%),var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}.wrap{width:min(100%,470px)}.brand{display:flex;align-items:center;gap:12px;margin:0 auto 24px;width:max-content;font-weight:800;letter-spacing:.12em}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--blue),#2e9bdb);box-shadow:0 8px 28px #5865f244;font-size:22px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.06em;font-weight:500;margin-top:3px}.card{border:1px solid var(--line);border-radius:22px;padding:32px;background:linear-gradient(145deg,#121d30f5,#0c1422f5);box-shadow:0 25px 80px #0006}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--cyan);font-weight:800}h1{font-size:clamp(25px,6vw,32px);letter-spacing:-.04em;line-height:1.12;margin:14px 0 12px}p{color:var(--muted);line-height:1.65;font-size:14px}.status{display:flex;gap:12px;align-items:flex-start;margin:24px 0 0;padding:15px;border:1px solid var(--line);border-radius:14px;background:#090f1b;color:#cbd6e7;font-size:13px;line-height:1.5}.dot{width:9px;height:9px;flex:0 0 9px;margin-top:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 4px #70d9ff16}.status.success .dot{background:var(--green);box-shadow:0 0 0 4px #57f28716}.status.error .dot{background:var(--red);box-shadow:0 0 0 4px #ed424516}.foot{text-align:center;color:#65758d;font-size:11px;margin:18px 0 0}.link{color:#9ab5ff;text-decoration:none}.link:hover{text-decoration:underline}@media(max-width:480px){.card{padding:24px;border-radius:18px}}
  </style>
</head>
<body><main class="wrap"><div class="brand"><span class="mark">T</span><span>TOSHIRO<small>BY GBZIN GROUP</small></span></div><section class="card"><span class="eyebrow">Autenticação oficial do Discord</span><h1 id="title">Confirmando sua conta</h1><p id="description">Estamos validando a autorização com segurança. Não feche esta página.</p><div class="status" id="status" role="status" aria-live="polite"><span class="dot"></span><span id="statusText">Conectando ao serviço de verificação…</span></div><p id="extra"></p></section><div class="foot">Sua senha nunca é solicitada por este site. <a class="link" href="https://discord.com/" rel="noreferrer">Discord</a></div></main>
<script>
(() => {
  // Configure esta URL para a URL HTTPS pública real do backend do bot.
  const API_BASE_URL = 'https://CONFIGURE-A-SUA-API-HTTPS-AQUI';
  const title = document.getElementById('title');
  const description = document.getElementById('description');
  const status = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const extra = document.getElementById('extra');
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const state = params.get('state');
  const error = params.get('error');
  const show = (kind, heading, detail, message) => { title.textContent=heading; description.textContent=detail; status.className='status '+kind; statusText.textContent=message; };
  if (error) { show('error','Autorização cancelada','O Discord não concluiu a autorização. Volte ao servidor e execute /verificar novamente.', error==='access_denied'?'Você cancelou a autorização.':'O Discord retornou um erro de autorização.'); return; }
  if (!code || !state) { show('error','Link inválido','Não encontramos os dados de segurança necessários. Volte ao Discord e use /verificar novamente.','Código ou estado de segurança ausente.'); return; }
  if (!API_BASE_URL || !/^https:\/\//i.test(API_BASE_URL)) { show('error','Configuração pendente','A página está pronta, mas falta configurar a URL HTTPS pública do backend do Toshiro em API_BASE_URL.','Configure API_BASE_URL com a URL HTTPS real do backend OAuth.'); return; }
  fetch(API_BASE_URL.replace(/\/+$/,'')+'/api/oauth/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,state}),cache:'no-store',credentials:'omit'})
    .then(async r=>{const data=await r.json().catch(()=>({}));if(!r.ok||!data.ok)throw new Error(data.message||'A verificação não foi concluída.');return data;})
    .then(data=>{show('success','Autorização concluída','Copie o código abaixo e volte ao Discord para executar /verificar-code com esse código.',data.message||'Código gerado.');extra.innerHTML='';const label=document.createElement('div');label.textContent='Seu código de verificação';label.style.cssText='margin:18px 0 8px;color:#9eacc2;font-size:12px';const codeBox=document.createElement('div');codeBox.textContent=data.verificationCode||'Código indisponível';codeBox.style.cssText='font-size:32px;font-weight:800;letter-spacing:.18em;text-align:center;padding:18px;border:1px solid #25334a;border-radius:14px;background:#080d18;color:#70d9ff;user-select:all';const button=document.createElement('button');button.textContent='Copiar código';button.style.cssText='width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:#5865f2;color:white;font-weight:700;cursor:pointer';button.onclick=()=>navigator.clipboard.writeText(data.verificationCode||'').then(()=>button.textContent='Código copiado').catch(()=>button.textContent='Selecione e copie o código');extra.append(label,codeBox,button);})
    .catch(err=>show('error','Não foi possível verificar','Volte ao Discord e tente novamente. Se o problema continuar, avise a equipe do servidor.',err.message||'Falha de comunicação com o backend.'));
})();
</script></body></html>
