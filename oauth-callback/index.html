<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificação — Copie o código</title>
  <meta name="theme-color" content="#0b0d14">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
  <style>

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      color-scheme: dark;
      --bg: #111318;
      --card: #191c23;
      --surface: #14171d;
      --border: #2b303a;
      --text: #f1f3f7;
      --muted: #a0a7b4;
      --primary: #6875e8;
      --primary-hover: #5966d6;
      --success: #55d6a2;
      --danger: #ef6878;
      --warning: #e7c477;
      --code-bg: #101319;
      --code-text: #d8ddff;
    }

    body {
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
      animation: appear .25s ease-out both;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 460px;
      padding: 34px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 16px 44px rgba(0, 0, 0, .22);
    }

    .card::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 28px;
      right: 28px;
      height: 2px;
      background: var(--primary);
      border-radius: 0 0 2px 2px;
    }

    .icon {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      margin: 0 auto 20px;
      border: 1px solid #343a4b;
      border-radius: 15px;
      background: #202431;
      font-size: 29px;
      line-height: 1;
    }

    h1 {
      margin-bottom: 9px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -.45px;
    }

    .subtitle {
      max-width: 340px;
      margin: 0 auto 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .subtitle b { color: var(--text); font-weight: 600; }

    .code-box {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 66px;
      margin-bottom: 12px;
      padding: 16px;
      border: 1px solid #39415b;
      border-radius: 10px;
      background: var(--code-bg);
      color: var(--code-text);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.65;
      overflow-wrap: anywhere;
      user-select: all;
      cursor: text;
      transition: border-color .15s ease;
    }

    .code-box:hover { border-color: var(--primary); }
    .code-box.loading { color: #81899a; font-style: italic; }
    .code-box.error { color: var(--danger); border-color: var(--danger); font-style: normal; }

    button {
      width: 100%;
      min-height: 46px;
      padding: 12px 18px;
      border: 0;
      border-radius: 9px;
      background: var(--primary);
      color: white;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      transition: background .15s ease, transform .15s ease;
    }

    button:hover:not(:disabled) { background: var(--primary-hover); }
    button:active:not(:disabled) { transform: scale(.99); }
    button:focus-visible { outline: 2px solid #a5adff; outline-offset: 3px; }
    button:disabled { background: #353946; color: #858b99; cursor: not-allowed; }
    button.copiado { background: var(--success); color: #10251d; }

    .timer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 18px;
      margin-top: 14px;
      color: var(--warning);
      font-size: 12.5px;
    }

    .timer b { color: var(--text); font-variant-numeric: tabular-nums; }
    .timer.critico { color: var(--danger); }

    .passos {
      margin-top: 22px;
      padding: 17px 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--muted);
      text-align: left;
      font-size: 12.5px;
      line-height: 1.8;
    }

    .passos b { color: var(--text); font-weight: 600; }
    .passos ol { margin-top: 7px; padding-left: 19px; }
    .passos li { padding-left: 2px; margin-bottom: 3px; }
    .passos li:last-child { margin-bottom: 0; }

    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 21px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: #818998;
      font-size: 11px;
      line-height: 1.5;
    }

    .footer svg { width: 14px; height: 14px; fill: currentColor; flex: 0 0 auto; }

    @media (max-width: 480px) {
      body { padding: 16px 10px; }
      .card { padding: 27px 20px 22px; border-radius: 13px; }
      .icon { width: 52px; height: 52px; margin-bottom: 17px; font-size: 26px; }
      h1 { font-size: 22px; }
      .subtitle { font-size: 13px; margin-bottom: 21px; }
      .code-box { font-size: 12px; padding: 14px 12px; }
      .passos { padding: 15px; font-size: 12px; }
      .footer { align-items: flex-start; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    .hidden { display: none !important; }

  </style>
</head>
<body>
  <div class="card">
    <span class="icon" id="icon">⏳</span>
    <h1 id="titulo">Processando...</h1>
    <p class="subtitle" id="subtitulo">Aguarde um instante.</p>

    <div id="conteudo" class="hidden">
      <div class="code-box loading" id="codeBox">Carregando...</div>

      <button id="btnCopiar" disabled>📋 Copiar código</button>

      <div class="timer" id="timer"></div>

      <div class="passos">
        <b>Como usar:</b>
        <ol>
          <li>Copie o código acima</li>
          <li>Volte ao Discord</li>
          <li>Use <b>/verificar-codigo</b> e cole o código</li>
          <li>Pronto, você está verificado ✅</li>
        </ol>
      </div>
    </div>

    <div class="footer">
      <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
      <span>Autorização oficial do Discord • Nunca pedimos sua senha</span>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      /* ============================================================
       *  REFERÊNCIAS
       * ========================================================== */
      const icon       = document.getElementById('icon');
      const titulo     = document.getElementById('titulo');
      const subtitulo  = document.getElementById('subtitulo');
      const conteudo   = document.getElementById('conteudo');
      const codeBox    = document.getElementById('codeBox');
      const btnCopiar  = document.getElementById('btnCopiar');
      const timerEl    = document.getElementById('timer');

      /* ============================================================
       *  CONSTANTES
       * ========================================================== */
      const TTL_MS = 10 * 60 * 1000; // 10 minutos (igual ao backend)

      /* ============================================================
       *  ESTADOS VISUAIS
       * ========================================================== */
      function estadoErro(mensagem) {
        icon.textContent = '❌';
        titulo.textContent = 'Ops!';
        subtitulo.textContent = mensagem;
        conteudo.classList.add('hidden');
      }

      function estadoPronto(code) {
        icon.textContent = '✅';
        titulo.textContent = 'Autorizado!';
        subtitulo.innerHTML = 'Copie o código abaixo e cole no Discord com <b>/verificar-codigo</b>.';

        conteudo.classList.remove('hidden');
        codeBox.classList.remove('loading');
        codeBox.textContent = code;
        btnCopiar.disabled = false;

        iniciarTimer();
      }

      /* ============================================================
       *  LÊ PARÂMETROS DA URL
       * ========================================================== */
      const params = new URLSearchParams(window.location.search);
      const code   = params.get('code');
      const erro   = params.get('error');
      const erroDesc = params.get('error_description');

      /* ============================================================
       *  CASOS DE ERRO
       * ========================================================== */
      if (erro) {
        const mensagens = {
          access_denied: 'Você recusou a autorização. Volte ao Discord e tente novamente.',
          invalid_scope: 'Escopo inválido. Avise um administrador.',
          invalid_request: 'Requisição inválida. Volte ao Discord e tente novamente.',
        };
        estadoErro(mensagens[erro] || erroDesc || 'Autorização negada.');
        return;
      }

      if (!code) {
        estadoErro(
          'Nenhum código foi recebido. ' +
          'Volte ao Discord, use !verificar novamente e clique no botão "Autorizar no Discord".'
        );
        return;
      }

      // Sucesso!
      estadoPronto(code);

      /* ============================================================
       *  BOTÃO COPIAR
       * ========================================================== */
      btnCopiar.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(code);
          feedbackCopiado();
        } catch {
          // Fallback para navegadores antigos
          try {
            const ta = document.createElement('textarea');
            ta.value = code;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
            feedbackCopiado();
          } catch {
            btnCopiar.textContent = '❌ Falha ao copiar';
            setTimeout(restaurarBtn, 2000);
          }
        }
      });

      function feedbackCopiado() {
        btnCopiar.textContent = '✅ Copiado!';
        btnCopiar.classList.add('copiado');
        setTimeout(restaurarBtn, 2000);
      }

      function restaurarBtn() {
        btnCopiar.textContent = '📋 Copiar código';
        btnCopiar.classList.remove('copiado');
      }

      /* ============================================================
       *  TIMER DE EXPIRAÇÃO (10 min)
       * ========================================================== */
      function iniciarTimer() {
        const inicio = Date.now();

        function atualizar() {
          const restante = TTL_MS - (Date.now() - inicio);

          if (restante <= 0) {
            timerEl.classList.add('critico');
            timerEl.innerHTML = '⏰ <b>Código expirado!</b> Volte ao Discord e use <b>!verificar</b> novamente.';
            btnCopiar.disabled = true;
            codeBox.style.opacity = '.5';
            return;
          }

          const min = Math.floor(restante / 60000);
          const seg = Math.floor((restante % 60000) / 1000);
          const pad = n => String(n).padStart(2, '0');

          timerEl.innerHTML = `⏱️ O código expira em <b>${pad(min)}:${pad(seg)}</b>`;

          if (restante < 60_000) timerEl.classList.add('critico');
          else timerEl.classList.remove('critico');

          requestAnimationFrame(() => setTimeout(atualizar, 1000));
        }

        atualizar();
      }

      /* ============================================================
       *  TÍTULO DINÂMICO (feedback visual na aba)
       * ========================================================== */
      document.addEventListener('visibilitychange', () => {
        document.title = document.hidden
          ? '🔐 Verificação pendente'
          : 'Verificação — Copie o código';
      });

      /* ============================================================
       *  ATALHO: Ctrl+C copia o código direto
       * ========================================================== */
      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'c' && !window.getSelection().toString()) {
          e.preventDefault();
          btnCopiar.click();
        }
      });
    })();
  </script>
</body>
</html>
