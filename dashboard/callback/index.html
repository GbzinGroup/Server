<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autorização · Toshiro Dashboard</title><style>
:root{color-scheme:dark;--bg:#0b0b10;--panel:#14141d;--line:#292938;--muted:#a4a4b5;--accent:#7865ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#211b46 0,transparent 55%),var(--bg);font:16px system-ui,-apple-system,Segoe UI,sans-serif;color:#f6f5ff}.card{width:min(480px,100%);padding:32px;border:1px solid var(--line);border-radius:22px;background:rgba(20,20,29,.96);text-align:center}.mark{font-size:32px;margin-bottom:12px}h1{font-size:24px;margin:0 0 10px}p{color:var(--muted);line-height:1.6}.status{padding:12px;border:1px solid var(--line);border-radius:12px;text-align:left;font-size:14px;overflow-wrap:anywhere}.btn{display:inline-block;margin-top:16px;padding:12px 18px;background:var(--accent);color:#fff;text-decoration:none;border-radius:10px;font-weight:700}.small{font-size:12px}
</style></head><body><main class="card"><div class="mark">🔐</div><h1>Finalizando autorização</h1><p id="message">Verificando retorno do Discord…</p><div id="status" class="status">Aguarde.</div><a id="continue" class="btn" href="/dashboard/" hidden>Ir para dashboard</a><p class="small">Se esta página não concluir, confirme que o redirect URI cadastrado no Discord é exatamente o mesmo usado pelo backend.</p></main>
<script>
// O código OAuth é temporário e deve ser trocado por token no backend. Nunca coloque CLIENT_SECRET nesta página.
// O endpoint Node deve receber o code e validar state; esta página encaminha para a rota de callback do backend.
const BACKEND_CALLBACK_URL = 'https://gbzin.com.br/dashboard/callback';
const params = new URLSearchParams(location.search);
const code = params.get('code'); const state = params.get('state'); const oauthError = params.get('error');
const message=document.getElementById('message'), status=document.getElementById('status');
if(oauthError){message.textContent='A autorização foi cancelada ou recusada.';status.textContent='Discord: '+oauthError;}
else if(!code){message.textContent='Código de autorização não encontrado.';status.textContent='Volte ao login e tente novamente. Não compartilhe URLs de callback nem códigos OAuth.';}
else if(BACKEND_CALLBACK_URL.includes('SEU-DOMINIO-DO-BOT')){message.textContent='A página de retorno está pronta, mas falta configurar o backend.';status.textContent='Substitua BACKEND_CALLBACK_URL pelo endereço HTTPS público do backend Node.js. O código não foi enviado nem armazenado.';}
else {const target=new URL(BACKEND_CALLBACK_URL);target.searchParams.set('code',code);if(state)target.searchParams.set('state',state);location.replace(target.toString());}
</script></body></html>
