<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b13"><title>Retorno do Discord | Toshiro</title>
<style>
:root{color-scheme:dark;--bg:#080b13;--line:#243047;--text:#f5f7ff;--muted:#9aa8c3;--cyan:#71e7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#1d3761 0,transparent 48%),var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--text)}main{width:min(100%,500px);padding:34px;border:1px solid var(--line);border-radius:24px;background:#101725;text-align:center}h1{font-size:28px}p{color:var(--muted);line-height:1.7;font-size:14px}.box{margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:12px;text-align:left;font-size:12px;line-height:1.7;color:#c9d6ed;overflow-wrap:anywhere}a{display:inline-block;margin-top:18px;color:var(--cyan);font-weight:800;text-decoration:none}.logo{margin:auto;width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,#71e7ff,#527dff);color:#07111e;font-size:25px;font-weight:1000}
</style></head><body><main><div class="logo">T</div><h1 id="title">Retorno do Discord</h1><p id="description">Verificando os parâmetros retornados pelo Discord.</p><div class="box" id="details">Aguarde…</div><a href="/dashboard/login/">Voltar para o login</a></main>
<script>
const params = new URLSearchParams(location.search);
const code = params.get("code");
const state = params.get("state");
const error = params.get("error");
const expected = sessionStorage.getItem("toshiro_oauth_state");
const title = document.getElementById("title");
const description = document.getElementById("description");
const details = document.getElementById("details");
if (error) {
  title.textContent = "Autorização cancelada";
  description.textContent = "Você não autorizou o acesso no Discord.";
  details.textContent = "Código retornado: " + error;
} else if (!code || !state) {
  title.textContent = "Retorno incompleto";
  description.textContent = "O Discord não retornou os parâmetros esperados.";
  details.textContent = "Volte ao login e tente novamente.";
} else if (!expected || state !== expected) {
  title.textContent = "Verificação de segurança falhou";
  description.textContent = "O parâmetro state não corresponde à tentativa iniciada neste navegador.";
  details.textContent = "Por segurança, não prossiga. Volte ao login e tente novamente.";
} else {
  sessionStorage.removeItem("toshiro_oauth_state");
  title.textContent = "Autorização recebida";
  description.textContent = "O Discord retornou um código de autorização.";
  details.textContent = "A página é estática do GitHub Pages: ela não pode trocar este código por um token nem confirmar permissões do servidor com segurança. Para concluir o login, conecte um backend seguro. Não compartilhe este endereço nem o código.";
}
</script></body></html>
