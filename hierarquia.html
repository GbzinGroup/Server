<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Hierarquia de Cargos • Discord</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'gg sans', 'Segoe UI', sans-serif; }

  body {
    background: #1e1f22;
    color: #dbdee1;
    min-height: 100vh;
    padding: 24px;
    display: flex;
    justify-content: center;
  }

  .app {
    max-width: 900px;
    width: 100%;
  }

  .header {
    background: #2b2d31;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid #3f4147;
  }

  .header h1 {
    font-size: 20px;
    color: #f2f3f5;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header h1 .dot {
    width: 12px; height: 12px;
    background: #5865f2;
    border-radius: 50%;
    box-shadow: 0 0 12px #5865f2;
  }

  textarea {
    width: 100%;
    min-height: 140px;
    background: #1e1f22;
    border: 1px solid #3f4147;
    border-radius: 8px;
    padding: 12px;
    color: #dbdee1;
    font-family: 'Consolas', monospace;
    font-size: 12px;
    resize: vertical;
    outline: none;
  }

  textarea:focus { border-color: #5865f2; }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  button {
    background: #5865f2;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: 0.15s;
  }

  button:hover { background: #4752c4; }
  button.secondary { background: #4e5058; }
  button.secondary:hover { background: #6d6f78; }
  button.danger { background: #da373c; }
  button.danger:hover { background: #a12828; }

  .info-bar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    font-size: 13px;
    color: #949ba4;
  }

  .info-bar .chip {
    background: #2b2d31;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid #3f4147;
  }

  .info-bar .chip b { color: #f2f3f5; }

  /* ===== HIERARQUIA ===== */
  .hierarchy {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .cargo {
    background: #2b2d31;
    border-radius: 10px;
    border-left: 4px solid #5865f2;
    padding: 14px 16px;
    cursor: pointer;
    transition: 0.15s;
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
  }

  .cargo:hover {
    background: #35373c;
    transform: translateX(4px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  .cargo .nivel {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: #1e1f22;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: #fff;
    flex-shrink: 0;
  }

  .cargo .info {
    flex: 1;
    min-width: 0;
  }

  .cargo .nome {
    font-size: 15px;
    font-weight: 600;
    color: #f2f3f5;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .cargo .id {
    font-family: monospace;
    font-size: 11px;
    color: #949ba4;
    background: #1e1f22;
    padding: 1px 8px;
    border-radius: 4px;
  }

  .cargo .stats {
    font-size: 12px;
    color: #b5bac1;
    margin-top: 4px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .cargo .stats span b { color: #f2f3f5; }

  .cargo .f12-hint {
    font-family: monospace;
    font-size: 11px;
    background: #1e1f22;
    color: #949ba4;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid #3f4147;
    opacity: 0;
    transition: 0.15s;
    flex-shrink: 0;
  }

  .cargo:hover .f12-hint { opacity: 1; color: #79c0ff; border-color: #5865f2; }

  /* Barra proporcional */
  .cargo .bar {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    border-top-left-radius: 10px;
    border-bottom-left-radius: 10px;
  }

  /* ===== MODAL F12 ===== */
  .f12-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    justify-content: center;
    align-items: flex-end;
    z-index: 100;
    backdrop-filter: blur(4px);
  }

  .f12-overlay.active { display: flex; }

  .f12-panel {
    background: #1e1f22;
    width: 100%;
    max-width: 850px;
    height: 72vh;
    border-top-left-radius: 12px;
    border-top-right-radius: 12px;
    display: flex;
    flex-direction: column;
    animation: slideUp 0.25s ease-out;
    border: 1px solid #3f4147;
    border-bottom: none;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.7);
  }

  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .f12-topbar {
    display: flex;
    align-items: center;
    background: #2b2d31;
    padding: 8px 14px;
    border-top-left-radius: 12px;
    border-top-right-radius: 12px;
    gap: 8px;
    border-bottom: 1px solid #3f4147;
  }

  .f12-dots { display: flex; gap: 6px; }
  .f12-dots span { width: 12px; height: 12px; border-radius: 50%; }
  .f12-dots .r { background: #ff5f56; }
  .f12-dots .y { background: #ffbd2e; }
  .f12-dots .g { background: #27c93f; }

  .f12-title {
    flex: 1;
    text-align: center;
    font-size: 12px;
    color: #949ba4;
    font-family: monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .f12-close {
    background: transparent;
    border: none;
    color: #949ba4;
    cursor: pointer;
    font-size: 18px;
    padding: 2px 10px;
    border-radius: 4px;
  }

  .f12-close:hover { background: #404249; color: #fff; }

  .f12-tabs {
    display: flex;
    background: #2b2d31;
    padding: 0 10px;
    gap: 4px;
    border-bottom: 1px solid #3f4147;
    overflow-x: auto;
  }

  .f12-tab {
    padding: 8px 14px;
    font-size: 12px;
    color: #949ba4;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    font-family: monospace;
    background: transparent;
    border-top: none;
    border-left: none;
    border-right: none;
    white-space: nowrap;
  }

  .f12-tab:hover { color: #dbdee1; }
  .f12-tab.active { color: #fff; border-bottom-color: #5865f2; }

  .f12-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    font-family: 'Consolas', monospace;
    font-size: 13px;
    color: #b5bac1;
  }

  .f12-content::-webkit-scrollbar { width: 10px; }
  .f12-content::-webkit-scrollbar-track { background: #1e1f22; }
  .f12-content::-webkit-scrollbar-thumb { background: #3f4147; border-radius: 5px; }

  .f12-content pre {
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.6;
  }

  .f12-content .key { color: #79c0ff; }
  .f12-content .str { color: #a5d6ff; }
  .f12-content .num { color: #79c0ff; }
  .f12-content .bool { color: #ff7b72; }
  .f12-content .null { color: #ff7b72; font-style: italic; }

  .membro-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: #2b2d31;
    border-radius: 8px;
    margin-bottom: 6px;
    border: 1px solid #3f4147;
  }

  .membro-item .av {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #5865f2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: white;
    overflow: hidden;
    flex-shrink: 0;
  }

  .membro-item .av img { width: 100%; height: 100%; object-fit: cover; }

  .membro-item .nm { flex: 1; font-size: 13px; color: #f2f3f5; }
  .membro-item .nm small { color: #949ba4; font-weight: 400; }

  .f12-footer {
    padding: 8px 14px;
    background: #2b2d31;
    font-size: 11px;
    color: #6e7681;
    font-family: monospace;
    border-top: 1px solid #3f4147;
    display: flex;
    justify-content: space-between;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #6d6f78;
  }

  .empty .icon { font-size: 48px; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="app">
  <!-- HEADER -->
  <div class="header">
    <h1><span class="dot"></span> Gerador de Hierarquia • Discord</h1>
    <textarea id="jsonInput" placeholder='Cole aqui o JSON do Discord (com "members" e "roles" como IDs)...'></textarea>
    <div class="actions">
      <button onclick="processar()">⚡ Gerar Hierarquia</button>
      <button class="secondary" onclick="colarExemplo()">📋 Exemplo</button>
      <button class="danger" onclick="limpar()">🗑️ Limpar</button>
    </div>
  </div>

  <!-- INFO -->
  <div class="info-bar" id="infoBar" style="display:none">
    <div class="chip">🏰 Guild: <b id="chipGuild">-</b></div>
    <div class="chip">🎭 Cargos: <b id="chipCargos">0</b></div>
    <div class="chip">👥 Membros: <b id="chipMembros">0</b></div>
  </div>

  <!-- HIERARQUIA -->
  <div class="hierarchy" id="hierarchy">
    <div class="empty">
      <div class="icon">📊</div>
      <div>Cole um JSON acima e clique em <b>Gerar Hierarquia</b></div>
    </div>
  </div>
</div>

<!-- MODAL F12 -->
<div class="f12-overlay" id="f12Overlay">
  <div class="f12-panel">
    <div class="f12-topbar">
      <div class="f12-dots">
        <span class="r"></span><span class="y"></span><span class="g"></span>
      </div>
      <div class="f12-title" id="f12Title">DevTools</div>
      <button class="f12-close" onclick="fecharF12()">✕</button>
    </div>

    <div class="f12-tabs">
      <button class="f12-tab active" data-tab="json">📄 Cargo</button>
      <button class="f12-tab" data-tab="membros">👥 Membros</button>
      <button class="f12-tab" data-tab="raw">🔧 Raw</button>
    </div>

    <div class="f12-content" id="f12Content"></div>

    <div class="f12-footer">
      <span id="f12Status">Console: pronto</span>
      <span>ESC para fechar</span>
    </div>
  </div>
</div>

<script>
// =====================================================
// ESTADO GLOBAL
// =====================================================
let CARGOS = [];      // [{id, membros:[], total}]
let CARGO_ATUAL = null;
let ABA_ATUAL = "json";
let GUILD_ID = "";

// =====================================================
// PROCESSAR JSON
// =====================================================
function processar() {
  const raw = document.getElementById("jsonInput").value.trim();
  if (!raw) return alert("Cole um JSON primeiro!");

  let data;
  try {
    data = JSON.parse(raw);
  } catch (e) {
    return alert("❌ JSON inválido:\n" + e.message);
  }

  // Aceita tanto {guild_id, members} quanto array direto de membros
  let membros = [];
  if (Array.isArray(data)) {
    membros = data;
  } else if (data.members && Array.isArray(data.members)) {
    membros = data.members;
    GUILD_ID = data.guild_id || "";
  } else {
    return alert("❌ JSON não contém 'members'. Cole o JSON de membros do Discord.");
  }

  // ===== AGRUPAR MEMBROS POR CARGO =====
  const mapa = new Map(); // roleId -> {id, membros:[]}

  membros.forEach(item => {
    const m = item.member || item;
    const roles = m.roles || [];
    const user = m.user || {};

    roles.forEach(rid => {
      if (!mapa.has(rid)) mapa.set(rid, { id: rid, membros: [] });
      mapa.get(rid).membros.push({ user, member: m });
    });
  });

  // Ordenar cargos por quantidade de membros (desc)
  CARGOS = Array.from(mapa.values()).sort((a, b) => b.membros.length - a.membros.length);

  // Atualizar UI
  document.getElementById("infoBar").style.display = "flex";
  document.getElementById("chipGuild").textContent = GUILD_ID || "—";
  document.getElementById("chipCargos").textContent = CARGOS.length;
  document.getElementById("chipMembros").textContent = membros.length;

  renderHierarquia();
}

// =====================================================
// RENDER HIERARQUIA
// =====================================================
function renderHierarquia() {
  const el = document.getElementById("hierarchy");
  if (CARGOS.length === 0) {
    el.innerHTML = '<div class="empty"><div class="icon">😕</div><div>Nenhum cargo encontrado</div></div>';
    return;
  }

  const maxMembros = Math.max(...CARGOS.map(c => c.membros.length));
  const total = CARGOS.reduce((s, c) => s + c.membros.length, 0);

  el.innerHTML = CARGOS.map((cargo, i) => {
    const cor = corDoCargo(cargo.id);
    const pct = (cargo.membros.length / maxMembros) * 100;
    const nivel = CARGOS.length - i;

    return `
      <div class="cargo" style="border-left-color:${cor}" onclick="abrirF12('${cargo.id}')">
        <div class="bar" style="background:${cor}; width:${Math.max(pct, 3)}%"></div>
        <div class="nivel" style="background:${cor}">#${nivel}</div>
        <div class="info">
          <div class="nome">
            🎭 Cargo ${cargo.id.slice(-6)}
            <span class="id">${cargo.id}</span>
          </div>
          <div class="stats">
            <span>👥 <b>${cargo.membros.length}</b> membros</span>
            <span>📊 <b>${((cargo.membros.length / total) * 100).toFixed(1)}%</b> do servidor</span>
          </div>
        </div>
        <div class="f12-hint">F12 ↵</div>
      </div>
    `;
  }).join("");
}

// =====================================================
// COR DO CARGO (hash determinístico)
// =====================================================
function corDoCargo(id) {
  const paleta = [
    "#5865f2", "#57f287", "#fee75c", "#eb459e", "#ed4245",
    "#faa61a", "#ff9500", "#00b0f4", "#9b59b6", "#1abc9c",
    "#e91e63", "#3498db", "#e67e22", "#2ecc71", "#f39c12"
  ];
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  return paleta[h % paleta.length];
}

// =====================================================
// ABRIR F12
// =====================================================
function abrirF12(roleId) {
  const cargo = CARGOS.find(c => c.id === roleId);
  if (!cargo) return;

  CARGO_ATUAL = cargo;
  document.getElementById("f12Title").textContent = `DevTools — role ${roleId}`;
  document.getElementById("f12Status").textContent = `Cargo: ${roleId} • ${cargo.membros.length} membros`;
  document.getElementById("f12Overlay").classList.add("active");
  renderAba(ABA_ATUAL);
}

function fecharF12() {
  document.getElementById("f12Overlay").classList.remove("active");
}

// =====================================================
// TABS
// =====================================================
document.querySelectorAll(".f12-tab").forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll(".f12-tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    ABA_ATUAL = tab.dataset.tab;
    renderAba(ABA_ATUAL);
  };
});

// =====================================================
// RENDER ABA
// =====================================================
function renderAba(tipo) {
  if (!CARGO_ATUAL) return;
  const el = document.getElementById("f12Content");
  const cargo = CARGO_ATUAL;

  if (tipo === "json") {
    const obj = {
      role_id: cargo.id,
      total_membros: cargo.membros.length,
      membros: cargo.membros.map(m => ({
        id: m.user.id,
        username: m.user.username,
        global_name: m.user.global_name,
        bot: !!m.user.bot
      }))
    };
    el.innerHTML = `<pre>${hl(JSON.stringify(obj, null, 2))}</pre>`;
  }

  else if (tipo === "membros") {
    el.innerHTML = cargo.membros.map(m => {
      const u = m.user;
      const url = avatarUrl(u);
      const initials = (u.global_name || u.username || "?").replace(/[^\p{L}\p{N}]/gu, "").slice(0, 2).toUpperCase();
      return `
        <div class="membro-item">
          <div class="av">${url ? `<img src="${url}" onerror="this.parentElement.textContent='${initials}'">` : initials}</div>
          <div class="nm">
            ${u.global_name || u.username} ${u.bot ? '🤖' : ''}
            <br><small>@${u.username} • ${u.id}</small>
          </div>
        </div>
      `;
    }).join("");
  }

  else if (tipo === "raw") {
    el.innerHTML = `<pre>${hl(JSON.stringify(cargo, null, 2))}</pre>`;
  }
}

// =====================================================
// HELPERS
// =====================================================
function avatarUrl(u) {
  if (!u.avatar) return null;
  const ext = u.avatar.startsWith("a_") ? "gif" : "png";
  return `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.${ext}?size=64`;
}

function hl(json) {
  return json
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, m => {
      let c = "num";
      if (/^"/.test(m)) c = /:$/.test(m) ? "key" : "str";
      else if (/true|false/.test(m)) c = "bool";
      else if (/null/.test(m)) c = "null";
      return `<span class="${c}">${m}</span>`;
    });
}

// =====================================================
// BOTÕES
// =====================================================
function colarExemplo() {
  document.getElementById("jsonInput").value = JSON.stringify({
    guild_id: "1559767910812225597",
    members: [
      { member: { roles: ["111","222","333"], user: { id: "1", username: "paulo", global_name: "Paulo", avatar: null } } },
      { member: { roles: ["222","333"], user: { id: "2", username: "yumi", global_name: "Yumi", avatar: null } } },
      { member: { roles: ["333"], user: { id: "3", username: "bot", global_name: null, bot: true, avatar: null } } }
    ]
  }, null, 2);
}

function limpar() {
  document.getElementById("jsonInput").value = "";
  document.getElementById("hierarchy").innerHTML = '<div class="empty"><div class="icon">📊</div><div>Cole um JSON acima e clique em <b>Gerar Hierarquia</b></div></div>';
  document.getElementById("infoBar").style.display = "none";
  CARGOS = [];
}

// ESC + clique fora
document.addEventListener("keydown", e => { if (e.key === "Escape") fecharF12(); });
document.getElementById("f12Overlay").addEventListener("click", e => {
  if (e.target.id === "f12Overlay") fecharF12();
});
</script>
</body>
</html>
